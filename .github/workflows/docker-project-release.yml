name: Docker Project Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish || 'false' }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Validate release branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Release requires main. Select the main branch when running this workflow manually.'
            exit 1
          fi
      - name: Checkout control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Number latest main and reserve its tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: "\u307f\u305a"
          GIT_AUTHOR_EMAIL: "mizu.copo@gmail.com"
          GIT_COMMITTER_NAME: "\u307f\u305a"
          GIT_COMMITTER_EMAIL: "mizu.copo@gmail.com"

          DOCKERHUB_USERNAME: "mizucopo"
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -I .github/scripts/release.py prepare

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    outputs:
      promote_latest: ${{ steps.publish.outputs.promote_latest }}
    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Validate project images
        env:
          IMAGE_REPOSITORY: "mizucopo/n8n-extended"
        run: python3 .github/scripts/docker-image-pipeline.py quality
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Publish missing images and GitHub Release
        id: publish
        env:
          IMAGE_REPOSITORY: "mizucopo/n8n-extended"
          DOCKERHUB_USERNAME: "mizucopo"
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/docker-image-pipeline.py release

  promote-latest:
    needs: [prepare, release]
    if: needs.release.outputs.promote_latest == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Check newest completed release
        id: latest-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py latest
      - name: Set up Docker Buildx
        if: steps.latest-state.outputs.promote_latest == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to Docker Hub
        if: steps.latest-state.outputs.promote_latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "mizucopo"
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish latest image
        if: steps.latest-state.outputs.promote_latest == 'true'
        env:
          IMAGE_REPOSITORY: "mizucopo/n8n-extended"
          TAG: ${{ steps.latest-state.outputs.image_tag }}
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$TAG"
      - name: Mark GitHub Release as latest
        if: steps.latest-state.outputs.promote_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest-state.outputs.release_tag }}
        run: gh release edit "$TAG" --latest
