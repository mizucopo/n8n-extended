name: Release n8n Extended Image

on:
  push:
    branches:
      - main
    paths:
      - version
      - revision
      - Dockerfile
      - scripts/resolve-n8n-extended-tags.sh
      - .github/workflows/release-n8n-extended.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  IMAGE_REPOSITORY: mizucopo/n8n-extended
  DOCKERHUB_USERNAME: mizucopo
  DOCKERHUB_URL: https://hub.docker.com/r/mizucopo/n8n-extended

jobs:
  release-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow can only release from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Acquire release lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/acquire-docker-release-lock.sh

  release:
    needs: release-lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Acquire or reuse release lock
        id: release-queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/acquire-docker-release-lock.sh

      - name: Resolve release tags
        id: tags
        run: scripts/resolve-n8n-extended-tags.sh

      - name: Inspect existing git tag and release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          tag_exists=false
          release_exists=false

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"

            if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${tag_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "${release_exists}" = "true" ] && [ "${tag_exists}" != "true" ]; then
            echo "Release ${RELEASE_TAG} exists, but the matching git tag was not found." >&2
            exit 1
          fi

          {
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stop if release already exists
        if: steps.existing.outputs.tag_exists == 'true' && steps.existing.outputs.release_exists == 'true'
        run: echo "Release ${{ steps.tags.outputs.release_tag }} already exists for this commit."

      - name: Login to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_TOKEN is required." >&2
            exit 1
          fi

          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Check Docker Hub tag
        id: image-state
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAG: ${{ steps.tags.outputs.image_tag }}
        run: |
          set -euo pipefail

          inspect_output="$(docker manifest inspect "${IMAGE}" 2>&1)" && inspect_status=0 || inspect_status=$?

          if [ "${inspect_status}" -eq 0 ]; then
            bash .github/scripts/manage-docker-image-owner.sh verify "$TAG"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "${inspect_output}" | grep -Eq 'no such manifest|manifest unknown'; then
            echo "Docker image tag is available: ${IMAGE}"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not inspect Docker Hub tag: ${IMAGE}" >&2
            printf '%s\n' "${inspect_output}" >&2
            exit "${inspect_status}"
          fi

      - name: Record Docker image ownership
        if: steps.existing.outputs.tag_exists != 'true' && steps.image-state.outputs.image_exists != 'true'
        env:
          TAG: ${{ steps.tags.outputs.image_tag }}
        run: bash .github/scripts/manage-docker-image-owner.sh record "$TAG"

      - name: Build and push Extended Image
        if: steps.existing.outputs.tag_exists != 'true' && steps.image-state.outputs.image_exists != 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          N8N_VERSION: ${{ steps.tags.outputs.n8n_version }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg N8N_VERSION="${N8N_VERSION}" \
            --platform linux/amd64 \
            -t "${IMAGE}" \
            .

          docker push "${IMAGE}"

      - name: Create annotated git tag
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Extended Image Release ${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Release Docker image ownership
        env:
          TAG: ${{ steps.tags.outputs.image_tag }}
        run: bash .github/scripts/manage-docker-image-owner.sh release "$TAG"

      - name: Authorize latest publication
        id: latest-state
        run: bash .github/scripts/authorize-docker-latest.sh

      - name: Publish latest tag
        if: steps.latest-state.outputs.publish_latest == 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail

          docker pull "${IMAGE}"
          docker tag "${IMAGE}" "${IMAGE_REPOSITORY}:latest"
          docker push "${IMAGE_REPOSITORY}:latest"

      - name: Create missing release for existing tag
        if: steps.existing.outputs.tag_exists == 'true' && steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_LATEST: ${{ steps.latest-state.outputs.publish_latest }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail

          docker manifest inspect "${IMAGE}" >/dev/null

          {
            echo "## Docker Image"
            echo
            echo "この GitHub Release に対応する Extended Image です。"
            echo
            echo "- Extended Image: \`${IMAGE}\`"
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              echo "- Latest Image: \`${IMAGE_REPOSITORY}:latest\`"
            fi
            echo
            echo "Docker Hub: ${DOCKERHUB_URL}"
          } > release-notes.md

          latest_option="--latest=false"
          if [ "${PUBLISH_LATEST}" = "true" ]; then
            latest_option="--latest"
          fi

          gh release create "${RELEASE_TAG}" \
            "${latest_option}" \
            --verify-tag \
            --title "Release ${RELEASE_TAG}" \
            --notes-file release-notes.md

      - name: Create GitHub Release
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_LATEST: ${{ steps.latest-state.outputs.publish_latest }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail

          {
            echo "## Docker Image"
            echo
            echo "この GitHub Release に対応する Extended Image です。"
            echo
            echo "- Extended Image: \`${IMAGE}\`"
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              echo "- Latest Image: \`${IMAGE_REPOSITORY}:latest\`"
            fi
            echo
            echo "Docker Hub: ${DOCKERHUB_URL}"
          } > release-notes.md

          latest_option="--latest=false"
          if [ "${PUBLISH_LATEST}" = "true" ]; then
            latest_option="--latest"
          fi

          gh release create "${RELEASE_TAG}" \
            "${latest_option}" \
            --verify-tag \
            --title "Release ${RELEASE_TAG}" \
            --notes-file release-notes.md

      - name: Release lock
        if: always() && steps.release-queue.outputs.lock_commit != ''
        env:
          LOCK_COMMIT: ${{ steps.release-queue.outputs.lock_commit }}
        run: |
          git push \
            --force-with-lease="refs/heads/automation/docker-release-lock:$LOCK_COMMIT" \
            origin ":refs/heads/automation/docker-release-lock"
