name: Check n8n Extended Image Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: mizucopo/n8n-extended
  REVISION_HINT: Update revision to the next Extended Image Revision, such as r1 or r2.

jobs:
  check:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.merged == false && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest

    steps:
      - name: Check current PR state
        id: pr_state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # GET a pull request accepts the existing contents: read permission.
          if ! pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"; then
            echo "Could not inspect current PR state; refusing to skip release validation." >&2
            exit 1
          fi

          state="$(jq -er '.state | select(. == "open" or . == "closed")' <<< "${pr_json}")"
          merged="$(jq -er 'if .merged == true then "true" elif .merged == false then "false" else error("Missing PR merged state") end' <<< "${pr_json}")"

          if [ "${state}" != "open" ] || [ "${merged}" = "true" ]; then
            echo "PR is closed or merged; skipping checkout and release validation."
            echo "validate=false" >> "${GITHUB_OUTPUT}"
          else
            echo "validate=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.pr_state.outputs.validate == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect release-triggering changes
        if: steps.pr_state.outputs.validate == 'true'
        id: release_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for commit_sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            if ! git cat-file -e "${commit_sha}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags origin "${commit_sha}"; then
                echo "Could not fetch PR comparison commit: ${commit_sha}" >&2
                exit 1
              fi
            fi

            if ! git cat-file -e "${commit_sha}^{commit}" 2>/dev/null; then
              echo "PR comparison commit is unavailable: ${commit_sha}" >&2
              exit 1
            fi
          done

          if [ "$(git rev-parse HEAD)" != "${HEAD_SHA}" ]; then
            echo "Checkout does not match the event PR head: ${HEAD_SHA}" >&2
            exit 1
          fi

          if ! git merge-base "${BASE_SHA}" "${HEAD_SHA}" >/dev/null; then
            echo "No merge base for PR comparison: ${BASE_SHA}...${HEAD_SHA}" >&2
            exit 1
          fi

          release_inputs=(
            version
            revision
            Dockerfile
            scripts/resolve-n8n-extended-tags.sh
            '.github/scripts/*.sh'
            .github/workflows/release-n8n-extended.yml
          )

          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- "${release_inputs[@]}"; then
            release_changes=false
          else
            diff_status=$?

            if [ "${diff_status}" -ne 1 ]; then
              echo "Could not compare PR release inputs (git diff exit ${diff_status})." >&2
              exit "${diff_status}"
            fi

            release_changes=true
          fi

          echo "release_changes=${release_changes}" >> "${GITHUB_OUTPUT}"

      - name: Report no release changes
        if: steps.pr_state.outputs.validate == 'true' && steps.release_changes.outputs.release_changes == 'false'
        run: echo "No release-triggering files changed; skipping duplicate tag checks."

      - name: Resolve release tags
        if: steps.release_changes.outputs.release_changes == 'true'
        id: tags
        run: scripts/resolve-n8n-extended-tags.sh

      - name: Check git tag
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Extended Image Release Tag already exists: ${RELEASE_TAG}" >&2
            echo "${REVISION_HINT}" >&2
            exit 1
          fi

      - name: Check Docker Hub tag
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail

          repository_path="${IMAGE%:*}"
          namespace="${repository_path%%/*}"
          repository="${repository_path#*/}"
          tag="${IMAGE##*:}"
          tag_url="https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}/tags/${tag}"
          http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${tag_url}")"

          case "${http_status}" in
            200)
              echo "Extended Image Tag already exists on Docker Hub: ${IMAGE}" >&2
              echo "${REVISION_HINT}" >&2
              exit 1
              ;;
            404)
              echo "Extended Image Tag is available on Docker Hub: ${IMAGE}"
              ;;
            *)
              echo "Could not inspect Docker Hub tag: ${IMAGE} (HTTP ${http_status})" >&2
              exit 1
              ;;
          esac

      - name: Report release tags
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail

          echo "Extended Image Release Tag is available: ${RELEASE_TAG}"
          echo "Extended Image Tag is available: ${IMAGE}"
