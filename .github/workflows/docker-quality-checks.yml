name: Docker Quality Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh .github/scripts/*.sh

      - name: Test release tag resolver
        run: bash tests/resolve-n8n-extended-tags.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read n8n version
        id: version
        run: echo "version=$(cat version)" >> "$GITHUB_OUTPUT"

      - name: Run Docker build checks
        env:
          N8N_VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx build --check --build-arg "N8N_VERSION=$N8N_VERSION" .

      - name: Build Docker image
        env:
          N8N_VERSION: ${{ steps.version.outputs.version }}
        run: docker build --build-arg "N8N_VERSION=$N8N_VERSION" --tag n8n-extended:pr .

      - name: Run Docker smoke test
        run: >-
          docker run --rm --entrypoint sh n8n-extended:pr -eu -c
          'docker --version && ffmpeg -version && n8n --version'
